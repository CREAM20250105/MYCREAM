<main id="main"><section class="page-hero"><div class="shell"><nav class="breadcrumbs" aria-label="現在の位置"><a href="index.html">ホーム</a><span aria-hidden="true">/</span><span aria-current="page">ブログ</span></nav><p class="eyebrow">CREAM BLOG</p><h1>日々の情報と、お知らせ。</h1><p class="page-intro">火災保険や営業、ライフスタイルなどの情報を発信します。</p></div></section>
  <div class="shell blog-content">
    <details class="post-panel"><summary>管理者用：記事を投稿する</summary>
    <form id="blogForm">
      <input type="text" name="title" aria-label="タイトル" placeholder="タイトル" required>
      <textarea name="content" aria-label="本文" rows="5" placeholder="本文" required></textarea>
      <input type="text" name="category" aria-label="カテゴリ" placeholder="カテゴリ">
      <input type="text" name="tags" aria-label="タグ" placeholder="タグ（カンマ区切り）">
      <input type="text" name="image" aria-label="画像URL" placeholder="画像URL">
      <input type="password" name="password" aria-label="投稿パスワード" placeholder="パスワードを入力してください" required>
      <button type="submit">投稿する</button>
    </form>
    </details>

    <div id="blog-list">読み込み中...</div>
  </div>

  </main>
<footer class="site-footer"><div class="shell footer-inner"><a class="brand" href="index.html"><img class="brand-image" src="images/cbf.png" alt="Cream Comfort better future — 元のCREAMロゴ" width="651" height="606"><span><strong>CREAM</strong><small>クリーム・工務店</small></span></a><nav aria-label="フッターメニュー"><a href="index.html#construction">工事内容</a><a href="index.html#fire-insurance">申請サポート</a><a href="gaiyou.htm">会社概要</a><a href="blog.html">ブログ</a></nav><p>© 2026 CREAM</p></div></footer><div class="mobile-contact"><a href="mailto:cream.250.cream@gmail.com">メールで相談</a><a href="index.html#contact">お問い合わせ <span aria-hidden="true">↗</span></a></div>
  <script>
    const endpoint = "https://script.google.com/macros/s/AKfycbxK-4X3PY23OO4eKS3BBJSTegYP3cCK79MNb7k94AFQBJ6sQn-kPTIsn7gkO5BMDnBN/exec"; // ← ご自身のデプロイURLをここに挿入してください

    document.getElementById("blogForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const form = e.target;
      const formData = new URLSearchParams(new FormData(form));

      fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: formData
      })
      .then(res => res.text())
      .then(msg => {
        alert(msg);
        form.reset();
        loadPosts();
      })
      .catch(err => alert("送信エラー：" + err));
    });

    function loadPosts() {
      fetch(endpoint)
        .then(res => res.json())
        .then(data => {
          const container = document.getElementById("blog-list");
          container.innerHTML = "";
          if (!Array.isArray(data)) throw new Error("記事データを確認できませんでした");
          if (data.length === 0) container.textContent = "記事はまだありません。";
          data.forEach(post => {
            const div = document.createElement("div");
            div.className = "blog-item";
            div.innerHTML = `
              <h3>${post.title}</h3>
              <p><strong>カテゴリ:</strong> ${post.category || '未分類'} | <strong>タグ:</strong> ${post.tags || 'なし'}</p>
              ${post.image ? `<img src="${post.image}" alt="投稿画像">` : ""}
              <p>${post.content}</p>
              <small>${post.timestamp}</small>
              <div class="admin-buttons">
                <button onclick="editPost(${post.id})">編集</button>
                <button onclick="deletePost(${post.id})">削除</button>
              </div>
            `;
            container.appendChild(div);
          });
        })
        .catch(() => { document.getElementById("blog-list").textContent = "記事を読み込めませんでした。時間をおいて再読み込みしてください。"; });
    }

    function deletePost(id) {
      const password = prompt("削除にはパスワードが必要です");
      fetch(`${endpoint}?id=${id}&password=${password}`, { method: "DELETE" })
        .then(res => res.text())
        .then(msg => {
          alert(msg);
          loadPosts();
        });
    }

    function editPost(id) {
      const title = prompt("新しいタイトルを入力してください");
      const content = prompt("新しい本文を入力してください");
      const password = prompt("編集にはパスワードが必要です");
      fetch(`${endpoint}?id=${id}&title=${encodeURIComponent(title)}&content=${encodeURIComponent(content)}&password=${password}`, {
        method: "PUT"
      })
      .then(res => res.text())
      .then(msg => {
        alert(msg);
        loadPosts();
      });
    }

    loadPosts();
  </script>
</body>
</html>
